name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -v --tb=short

      - name: Run scanner on examples
        run: |
          ai-scan scan ./examples/vulnerable --format json --output scan-results.json || true
          ai-scan scan ./examples/vulnerable --format sarif --output scan-results.sarif || true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-results
          path: |
            scan-results.json
            scan-results.sarif

  security-self-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Self-scan (scanner scanning its own source)
        run: |
          echo "🔍 Running scanner on its own source code..."
          ai-scan scan ./src --format markdown || true
